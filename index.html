<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mrithul - Resume</title>
  
  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400;700&display=swap" rel="stylesheet">


  <!-- Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Stylesheet -->
  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <!-- =========================
       NAVIGATION / HEADER
       ========================= -->
  <header class="nav">
    <div class="nav-inner">

      <!-- Navigation links -->
      <nav class="nav-left">
        <a href="#home">home</a>
        <a href="#projects">projects</a>
        <a href="#blog">blog</a>
        <a href="#contact">contact</a>
      </nav>

      <!-- Theme toggle button -->
      <div class="nav-right">
        <button id="themeToggle" class="icon"></button>
      </div>

    </div>
  </header>

  <main>

    <!-- =========================
         HOME SECTION
         ========================= -->
    <section id="home" class="home">

      <div class="home-grid">

        <!-- Home text content -->
        <div class="home-text">
          <h1 id="typeText"></h1>

          <p class="home-sub">
            Data Science student building practical software, web tools, and systems that solve real problems.
          </p>

          <p class="home-desc">
            I work at the intersection of coding, design, and leadership — creating projects that are functional, minimal, and purpose-driven.
          </p>

          <!-- Home actions / buttons -->
          <div class="home-actions">

            <a href="#" class="btn">
              Resume
              <i data-lucide="download"></i>
            </a>

            <a href="#" class="icon-link">
              <i data-lucide="linkedin"></i>
            </a>

            <a href="#" class="icon-link">
              <i data-lucide="github"></i>
            </a>

            <a href="#" class="icon-link">
              <i data-lucide="mail"></i>
            </a>

          </div>
        </div>

        <!-- Home photo stack -->
        <div class="home-photo">
          <div class="photo-stack">

            <img src="./src/pic.jpg" class="stack-img active">
            <img src="./src/pic1.jpeg" class="stack-img">
            <img src="./src/pic2.jpeg" class="stack-img">
            <img src="./src/pic.jpg" class="stack-img">
            <img src="./src/pic4.jpeg" class="stack-img">

          </div>
        </div>

      </div>
    </section>

    <!-- =========================
         EMPTY IFRAME (placeholder)
         ========================= -->
    <iframe src="" frameborder="0"></iframe>

    <!-- =========================
         PROJECTS SECTION
         ========================= -->
    <section id="projects" class="section">
      <h1>Projects</h1>
    </section>

    <!-- =========================
         BLOG SECTION
         ========================= -->
    <section id="blog" class="section">
      <h1>Blog</h1>
    </section>

    <!-- =========================
         CONTACT SECTION
         ========================= -->
    <section id="contact" class="section">
      <h1>Contact</h1>
    </section>

  </main>

  <!-- =========================
       SCRIPTS
       ========================= -->
  <script src="script.js"></script>

</body>
</html>
